# Monthly (and on demand): cut the next patch release from main so the images pick up Debian's
# security updates. Apps get it as a Dependabot PR on their pinned tag and digest.
name: rebuild

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  next:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "$last" ] || { echo "no release tag yet: tag v1.0.0 by hand first"; exit 1; }
          IFS=. read -r a b c <<< "${last#v}"
          echo "version=$a.$b.$((c + 1))" >> "$GITHUB_OUTPUT"
          echo "next after $last: $a.$b.$((c + 1))"

  release:
    needs: next
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.next.outputs.version }}
    secrets: inherit
