# The reusable workflow every slowapp repo calls (see README). It takes the SDK from the base image
# the app's Dockerfile pins, so an app is always checked by the tools of the base it builds on:
#
#   validate slowapp.toml → unit tests inside the base → build (amd64) → every [[example]] in
#   fixture mode, twice → previews as an artifact and in the job summary → the catalog bundle
#   (every example at every size, full-panel pictures with slowd's strips; MANIFEST.md "Catalog
#   bundle") as an artifact → an armv7 build for the board → on a vX.Y.Z tag, push X.Y.Z / X.Y / X
#   for armv7, arm64 and amd64, put the digest the hub should pin in the release notes, time the
#   examples on armv7, and attach the finished bundle to the release and to the image (an OCI
#   artifact that refers to its digest).
#
# Caller:
#   jobs:
#     app:
#       uses: mike-anderson/slowapp-base/.github/workflows/app.yml@v1.0.0   # Dependabot bumps it
#       permissions: { contents: write, packages: write }
name: app

on:
  workflow_call:
    inputs:
      image:
        description: "Image name under ghcr.io/<owner>/ (default: the repo name)"
        type: string
        default: ""
      platforms:
        type: string
        default: linux/arm/v7,linux/arm64,linux/amd64
      tests:
        description: "Unit test directory, run with unittest inside the base image (skipped if missing)"
        type: string
        default: tests
      fixture-timeout-scale:
        type: string
        default: "1"
      armv7-timeout-scale:
        description: "Timeout scale for the armv7 timing runs (QEMU is slow)"
        type: string
        default: "10"
      slowd-image:
        description: "The slowd-sim image that draws full-panel pictures (empty: blank strips)"
        type: string
        default: ghcr.io/mike-anderson/slowd-sim:0.1.0
    outputs:
      digest:
        description: "The pushed image's digest (tag builds only)"
        value: ${{ jobs.publish.outputs.digest }}

env:
  # The image the Dockerfile's final stage builds on (`awk "$BASE_OF" Dockerfile`): the last FROM,
  # past its --flags, with the ARG defaults declared before the first FROM filled in and an earlier
  # stage's name followed to its image. catalog.base_of() in the SDK does the same.
  BASE_OF: |
    toupper($1) == "ARG" && !seen && index($2, "=") {
      k = substr($2, 1, index($2, "=") - 1); v = substr($2, index($2, "=") + 1)
      gsub(/^["']|["']$/, "", v); arg[k] = v; next
    }
    toupper($1) == "FROM" {
      seen = 1; n = 0
      for (i = 2; i <= NF; i++) if ($i !~ /^--/) w[++n] = $i
      if (!n) next
      img = w[1]; out = ""
      while (match(img, /\$\{[A-Za-z0-9_]+\}|\$[A-Za-z0-9_]+/)) {
        t = substr(img, RSTART, RLENGTH); k = t; gsub(/[${}]/, "", k)
        out = out substr(img, 1, RSTART - 1) ((k in arg) ? arg[k] : t); img = substr(img, RSTART + RLENGTH)
      }
      img = out img
      if (tolower(img) in stage) img = stage[tolower(img)]
      if (n > 2 && toupper(w[2]) == "AS") stage[tolower(w[3])] = img
      base = img
    }
    END { print base }

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Base image and SDK
        id: base
        run: |
          base=$(awk "$BASE_OF" Dockerfile)
          [ -n "$base" ] || { echo "no FROM in Dockerfile"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base: $base"
          docker pull -q "$base"
          cid=$(docker create "$base")
          docker cp "$cid:/opt/slowapp" "$RUNNER_TEMP/slowapp"
          docker rm "$cid" >/dev/null
          echo "PYTHONPATH=$RUNNER_TEMP/slowapp" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"     # trixie's Python
      - run: pip install pillow

      - name: Validate slowapp.toml
        run: python -m slowapp_sdk validate

      - name: Unit tests (inside the base)
        if: hashFiles(format('{0}/**/*.py', inputs.tests)) != ''
        env:
          BASE: ${{ steps.base.outputs.base }}
          TESTS: ${{ inputs.tests }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONPATH=/src:/opt/slowapp "$BASE" \
            python3 -m unittest discover -v -s "$TESTS"

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker      # the fixture runner runs the image this step loads

      - name: Build (amd64)
        run: docker buildx build --load -t app:ci .

      - name: UI bundle (contract 4 [ui] entry)
        run: |
          entry=$(python3 -c 'import tomllib; print((tomllib.load(open("slowapp.toml", "rb")).get("ui") or {}).get("entry", ""))')
          if [ -z "$entry" ]; then echo "no [ui] entry"; exit 0; fi
          id=$(docker create app:ci)
          docker cp "$id:$entry" /tmp/ui.html || { echo "::error::[ui] entry $entry isn't in the image"; exit 1; }
          docker rm "$id" >/dev/null
          size=$(stat -c %s /tmp/ui.html)
          echo "$entry: $size bytes (the hub serves at most 2097152)"
          [ "$size" -le 2097152 ] || { echo "::error::$entry is over 2 MB"; exit 1; }
          python3 - <<'PY'
          import re, sys
          html = open("/tmp/ui.html", encoding="utf-8").read()
          ext = re.findall(r'<(?:script|link|img)\b[^>]*\b(?:src|href)="(?!data:|#)([^"]+)"', html)
          if ext:
              sys.exit(f"::error::the UI loads {ext}: the sandboxed frame can't fetch files (build it as one file)")
          PY

      - name: Examples in fixture mode (twice)
        env:
          SLOWAPP_ENGINE: docker
          SLOWAPP_TIMEOUT_SCALE: ${{ inputs.fixture-timeout-scale }}
        run: python -m slowapp_sdk fixture --image app:ci --repeat --out out/previews

      - name: Report
        if: always()
        run: '[ -f out/previews/report.md ] && cat out/previews/report.md >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: previews
          path: out/previews/
          if-no-files-found: warn
          retention-days: 14

      - name: Catalog bundle
        env:
          SLOWAPP_ENGINE: docker
          SLOWAPP_TIMEOUT_SCALE: ${{ inputs.fixture-timeout-scale }}
          SLOWD: ${{ inputs.slowd-image }}
        run: |
          if ! python -m slowapp_sdk catalog --help >/dev/null 2>&1; then
            echo "::notice::this base's SDK has no catalog builder (slowapp-python 1.3.0 and later have it)"
            exit 0
          fi
          args=()
          if [ -n "$SLOWD" ]; then
            if docker pull -q "$SLOWD"; then args=(--slowd-image "$SLOWD")
            else echo "::warning::couldn't pull $SLOWD: full-panel pictures get blank strips"; fi
          fi
          python -m slowapp_sdk catalog build --image app:ci --out out/catalog "${args[@]}"
          cat out/catalog/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: out/catalog/
          if-no-files-found: ignore
          retention-days: 30

  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
      - name: Build for the board (linux/arm/v7)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7
          push: false
          load: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: app:armv7
          cache-from: type=gha,scope=app-armv7
          cache-to: type=gha,scope=app-armv7,mode=max

      # Releases only: the examples timed on armv7 under QEMU, for the catalog ("measured in CI").
      - name: SDK from the base image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          base=$(awk "$BASE_OF" Dockerfile)
          docker pull -q "$base"
          cid=$(docker create "$base")
          docker cp "$cid:/opt/slowapp" "$RUNNER_TEMP/slowapp"
          docker rm "$cid" >/dev/null
          echo "PYTHONPATH=$RUNNER_TEMP/slowapp" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          python-version: "3.13"
      - name: Examples on armv7 (timings)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          SLOWAPP_ENGINE: docker
          SLOWAPP_PLATFORM: linux/arm/v7
          SLOWAPP_TIMEOUT_SCALE: ${{ inputs.armv7-timeout-scale }}
        run: |
          pip install pillow
          python -m slowapp_sdk fixture --image app:armv7 --out out/armv7
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: armv7-timings
          path: out/armv7/summary.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [test, armv7]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Version and name
        id: v
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          name="${IMAGE:-${GITHUB_REPOSITORY#*/}}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/$owner/$name" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          labels: org.opencontainers.image.version=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.ref }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.ref }}:${{ steps.v.outputs.minor }}
            ${{ steps.v.outputs.ref }}:${{ steps.v.outputs.major }}
          cache-from: type=gha,scope=app-release
          cache-to: type=gha,scope=app-release,mode=max
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.v.outputs.ref }}
          V: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf 'Pin in slowbhub.toml:\n\n```toml\nimage = "%s@%s"   # %s\n```\n' "$REF" "$DIGEST" "$V" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

      # The catalog bundle: the test job's renders plus the pushed image's sizes, the version and
      # the armv7 timings; attached to the release and pushed as an OCI artifact referring to the
      # image's digest (what the registry checks, and what the site and hubs render).
      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: out/catalog
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: armv7-timings
          path: out/armv7
        continue-on-error: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Catalog bundle (release)
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ steps.v.outputs.ref }}
          V: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ ! -f out/catalog/catalog.json ]; then
            echo "::notice::no catalog bundle (the base's SDK predates it): the hub renders the examples itself"
            exit 0
          fi
          base=$(awk "$BASE_OF" Dockerfile)
          cid=$(docker create "$base")
          docker cp "$cid:/opt/slowapp" "$RUNNER_TEMP/slowapp"
          docker rm "$cid" >/dev/null
          export PYTHONPATH="$RUNNER_TEMP/slowapp"
          pip install pillow
          args=()
          [ -f out/armv7/summary.json ] && args+=(--armv7 out/armv7/summary.json)
          [ -f CHANGELOG.md ] && args+=(--changelog CHANGELOG.md)
          python -m slowapp_sdk catalog release out/catalog --ref "$REF" --digest "$DIGEST" --version "$V" "${args[@]}"
          python -m slowapp_sdk catalog check out/catalog
          id=$(python3 -c 'import json; print(json.load(open("out/catalog/catalog.json"))["app"]["id"])')
          tar -czf "catalog-$id-$V.tar.gz" -C out/catalog catalog.json screens
          cp out/catalog/catalog.json "catalog-$id-$V.json"
          gh release upload "$GITHUB_REF_NAME" "catalog-$id-$V.json" "catalog-$id-$V.tar.gz" --clobber
          echo "files=catalog-$id-$V.json:application/vnd.slowboard.catalog.v1+json catalog-$id-$V.tar.gz:application/vnd.slowboard.catalog.screens.v1.tar+gzip" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@v1
        if: steps.catalog.outputs.files != ''
        with:
          version: 1.2.0
      - name: Catalog bundle as an OCI artifact on the image
        if: steps.catalog.outputs.files != ''
        env:
          REF: ${{ steps.v.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          FILES: ${{ steps.catalog.outputs.files }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          # shellcheck disable=SC2086
          oras attach --artifact-type application/vnd.slowboard.catalog.v1 "$REF@$DIGEST" $FILES
          oras discover --artifact-type application/vnd.slowboard.catalog.v1 "$REF@$DIGEST"
          printf '\nCatalog bundle: attached to this release and to `%s@%s` (artifact type application/vnd.slowboard.catalog.v1).\n' "$REF" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
