# Every push and PR: the kit, SDK and example tests on the runner and inside the images, the
# example app through the fixture runner twice, and both images built for the board (armv7, under
# QEMU) so a broken apt install shows up before a release.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"     # trixie's Python

      - run: pip install pillow jsonschema

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: JS packages (@slowboard/*) and the example's UI
        run: |
          npm ci
          npm test
          npm run build:example
          npm run build

      # A real S3 API for slowapp-remote's presigned-link test (kit/tests/test_remote.py, S3Links):
      # versitygw checks SigV4 signatures as S3 and Tigris do. A step, not a service: it needs args.
      - name: S3 for the remote-run test (versitygw)
        run: |
          docker run -d --name s3 -p 7070:7070 -e ROOT_ACCESS_KEY=slowapp -e ROOT_SECRET_KEY=slowapp-test-secret \
            docker.io/versity/versitygw:v1.0.16 posix /tmp
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7070/ && exit 0; sleep 1; done
          docker logs s3; exit 1

      - name: Unit tests (runner)
        env:
          PYTHONPATH: kit:sdk:example
          SLOWAPP_TEST_S3: http://127.0.0.1:7070
          SLOWAPP_TEST_S3_KEY: slowapp
          SLOWAPP_TEST_S3_SECRET: slowapp-test-secret
        run: |
          python -m unittest discover -v -s kit/tests
          python -m unittest discover -v -s sdk/tests
          python -m unittest discover -v -s example/tests

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker      # each build sees the image the previous one loaded

      - name: Images (amd64)
        run: |
          docker buildx build --load -f images/python/Dockerfile -t slowapp-python:dev .
          docker buildx build --load -f images/python-sci/Dockerfile --build-arg BASE=slowapp-python:dev -t slowapp-python-sci:dev .
          docker buildx build --load -f example/Dockerfile --build-arg BASE=slowapp-python:dev -t slowapp-example:dev example
          docker image ls 'slowapp-*'

      - name: Unit tests (inside the images)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONPATH=/opt/slowapp:/src/example slowapp-python:dev \
            sh -c 'python3 -m unittest discover -s kit/tests && python3 -m unittest discover -s sdk/tests && python3 -m unittest discover -s example/tests'
          # slowapp-remote is on PATH, and a kit app takes it as its command (with no links: exit 64)
          set +e
          docker run --rm slowapp-python:dev slowapp-remote job render; a=$?
          docker run --rm slowapp-example:dev slowapp-remote job render; b=$?
          set -e
          [ "$a" = 64 ] && [ "$b" = 64 ] || { echo "slowapp-remote: want 64 and 64, got $a and $b"; exit 1; }
          docker run --rm slowapp-python-sci:dev python3 -c '
          import os, numpy, slowapp_kit
          for v in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "MKL_NUM_THREADS"):
              assert os.environ.get(v) == "1", f"{v}={os.environ.get(v)!r}"
          print("sci ok, numpy", numpy.__version__)'

      # Contract 6: a render job runs in an empty network namespace. That needs root with
      # CAP_SYS_ADMIN, as a Fly Machine's root has; SLOWAPP_TEST_NETNS=1 makes the fallback a failure.
      - name: slowapp-remote without the network, and sealed (inside the image, CAP_SYS_ADMIN)
        run: |
          docker run --rm --cap-add SYS_ADMIN -v "$PWD:/src:ro" -w /src/kit/tests \
            -e PYTHONPATH=/opt/slowapp:/src/kit/tests -e SLOWAPP_TEST_NETNS=1 slowapp-python:dev \
            python3 -m unittest -v test_remote.Network test_remote.Sealed test_seal

      - name: Example UI bundle in the image
        run: |
          id=$(docker create slowapp-example:dev)
          docker cp "$id:/ui/index.html" /tmp/ui.html
          docker rm "$id" >/dev/null
          cmp /tmp/ui.html example/ui/dist/index.html
          node js/dev/bin/slowapp.js check /tmp/ui.html

      - name: Example app in fixture mode (twice)
        env:
          PYTHONPATH: kit:sdk
          SLOWAPP_ENGINE: docker
        run: python -m slowapp_sdk fixture example --image slowapp-example:dev --repeat --out out/previews

      - name: Report
        if: always()
        run: '[ -f out/previews/report.md ] && cat out/previews/report.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Example catalog bundle (every size, slowd's strips)
        env:
          PYTHONPATH: kit:sdk
          SLOWAPP_ENGINE: docker
          SLOWD: ghcr.io/mike-anderson/slowd-sim:0.1.0
        run: |
          args=()
          if docker pull -q "$SLOWD"; then args=(--slowd-image "$SLOWD")
          else echo "::warning::couldn't pull $SLOWD: full-panel pictures get blank strips"; fi
          python -m slowapp_sdk catalog build example --image slowapp-example:dev --out out/catalog "${args[@]}"
          python -m slowapp_sdk catalog check out/catalog
          cat out/catalog/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog
          path: out/catalog/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: previews
          path: out/previews/
          if-no-files-found: warn
          retention-days: 14

  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A local registry: the buildx container builder can't see `docker load`ed images, so the slim
    # image goes here and the sci build pulls it FROM localhost, as the release pulls it from GHCR.
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: slowapp-python (linux/arm/v7)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/python/Dockerfile
          platforms: linux/arm/v7
          tags: localhost:5000/slowapp-python:ci
          push: true
          cache-from: type=gha,scope=python-armv7
          cache-to: type=gha,scope=python-armv7,mode=max
      - name: slowapp-python-sci (linux/arm/v7)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/python-sci/Dockerfile
          platforms: linux/arm/v7
          build-args: BASE=localhost:5000/slowapp-python:ci
          tags: localhost:5000/slowapp-python-sci:ci
          push: true
          cache-from: type=gha,scope=sci-armv7
          cache-to: type=gha,scope=sci-armv7,mode=max
      - name: Kit tests on armv7
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/src:ro" -w /src -e PYTHONPATH=/opt/slowapp \
            localhost:5000/slowapp-python:ci python3 -m unittest discover -s kit/tests
