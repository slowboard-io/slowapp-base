# Publish both base images. A tag vX.Y.Z (or a call from rebuild.yml) builds slowapp-python for
# armv7 (the Lyra), arm64 and amd64, then slowapp-python-sci FROM the slim image's new digest, so
# the two share their lower layers on a board. Tags X.Y.Z, X.Y and X; there is no `latest`: apps
# pin X.Y.Z@sha256 and Dependabot moves them. The release notes list both digests.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z (no v)"
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      PLATFORMS: linux/arm/v7,linux/arm64,linux/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#v}}"
          [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: slowapp-python
        id: python
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/python/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/slowapp-python:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/slowapp-python:${{ steps.v.outputs.minor }}
            ${{ env.REGISTRY }}/slowapp-python:${{ steps.v.outputs.major }}
          cache-from: type=gha,scope=python-release
          cache-to: type=gha,scope=python-release,mode=max

      - name: slowapp-python-sci (FROM the slim digest)
        id: sci
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/python-sci/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            BASE=${{ env.REGISTRY }}/slowapp-python:${{ steps.v.outputs.version }}@${{ steps.python.outputs.digest }}
            VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/slowapp-python-sci:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/slowapp-python-sci:${{ steps.v.outputs.minor }}
            ${{ env.REGISTRY }}/slowapp-python-sci:${{ steps.v.outputs.major }}
          cache-from: type=gha,scope=sci-release
          cache-to: type=gha,scope=sci-release,mode=max

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          PY: ${{ steps.python.outputs.digest }}
          SCI: ${{ steps.sci.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          Pin these in an app's Dockerfile:

          \`\`\`dockerfile
          FROM $REGISTRY/slowapp-python:$V@$PY
          FROM $REGISTRY/slowapp-python-sci:$V@$SCI
          \`\`\`

          Contract 3 · platforms $PLATFORMS
          NOTES
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --notes-file notes.md
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
          fi
